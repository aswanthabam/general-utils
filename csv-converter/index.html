<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced CSV/Excel Converter</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for reading Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Custom scrollbar for the output area */
        pre::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        pre::-webkit-scrollbar-track {
            background: #2d3748; 
            border-radius: 4px;
        }
        pre::-webkit-scrollbar-thumb {
            background: #4a5568; 
            border-radius: 4px;
        }
        pre::-webkit-scrollbar-thumb:hover {
            background: #718096; 
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="ph ph-table"></i>
                Advanced Data Converter
            </h1>
            <p class="text-indigo-200 text-sm mt-1">Convert CSV and Excel (.xlsx, .xls) to JSON or Python Dictionaries.</p>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            
            <!-- Input Section Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <!-- File Upload Zone -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">Upload File</label>
                    <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:bg-slate-50 transition-colors cursor-pointer group flex flex-col items-center justify-center h-48 relative">
                        <i class="ph ph-upload-simple text-4xl text-slate-400 group-hover:text-indigo-500 mb-3 transition-colors"></i>
                        <p class="text-sm text-slate-600">Drag & drop your file here, or click to browse</p>
                        <p class="text-xs text-slate-400 mt-1">Supports .csv, .xlsx, .xls</p>
                        <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                    </div>
                    <div id="fileNameDisplay" class="text-sm font-medium text-indigo-600 hidden flex items-center gap-1 mt-2">
                        <i class="ph ph-file-text"></i> <span id="fileNameText"></span>
                    </div>
                </div>

                <!-- Text Area -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700 flex justify-between items-center">
                        <span>Or Paste CSV/Data</span>
                        <button onclick="clearInputs()" class="text-xs text-slate-400 hover:text-red-500 transition-colors">Clear</button>
                    </label>
                    <textarea id="csvInput" placeholder="Example:&#10;name,age,city&#10;Alice,25,London&#10;Bob,30,Paris" class="w-full h-48 p-4 border border-slate-300 rounded-xl font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none transition-all"></textarea>
                </div>
            </div>

            <!-- Column Inclusion/Exclusion Section -->
            <div id="columnSelectionContainer" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-5">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <i class="ph ph-check-square-offset text-lg"></i>
                        Select Columns to Include
                    </h3>
                    <div class="space-x-2 text-xs">
                        <button onclick="selectAllColumns(true)" class="text-indigo-600 hover:underline">Select All</button>
                        <span class="text-slate-300">|</span>
                        <button onclick="selectAllColumns(false)" class="text-indigo-600 hover:underline">Deselect All</button>
                    </div>
                </div>
                <div id="checkboxesGrid" class="flex flex-wrap gap-3 max-h-40 overflow-y-auto p-2">
                    <!-- Checkboxes injected here by JS -->
                </div>
            </div>

            <!-- Controls -->
            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <label for="formatSelect" class="text-sm font-medium text-slate-700">Format:</label>
                    <div class="relative">
                        <select id="formatSelect" class="appearance-none bg-white border border-slate-300 text-slate-700 py-2 pl-4 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer shadow-sm text-sm font-medium" onchange="convertData()">
                            <option value="json">JSON</option>
                            <option value="python">Python Dict/List</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <i class="ph ph-caret-down"></i>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="copyOutput()" class="flex items-center gap-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 py-2 px-4 rounded-lg font-medium text-sm transition-colors shadow-sm">
                        <i class="ph ph-copy"></i> Copy
                    </button>
                    <button onclick="downloadOutput()" class="flex items-center gap-2 bg-indigo-600 text-white hover:bg-indigo-700 py-2 px-4 rounded-lg font-medium text-sm transition-colors shadow-sm">
                        <i class="ph ph-download-simple"></i> Download
                    </button>
                </div>
            </div>

            <!-- Output Section -->
            <div class="relative rounded-xl overflow-hidden bg-[#1e1e1e] shadow-inner">
                <div class="absolute top-0 w-full bg-[#2d2d2d] py-2 px-4 flex justify-between items-center border-b border-gray-700">
                    <span class="text-xs text-gray-400 font-mono tracking-wider">OUTPUT</span>
                    
                    <!-- Custom Toast Notification inside Output -->
                    <div id="toast" class="opacity-0 transition-opacity duration-300 bg-emerald-500 text-white text-xs px-3 py-1 rounded-full font-medium shadow flex items-center gap-1">
                        <i class="ph ph-check-circle"></i> <span id="toastMsg">Copied!</span>
                    </div>
                </div>
                <pre id="output" class="p-6 pt-12 text-sm text-[#d4d4d4] font-mono whitespace-pre-wrap word-wrap min-h-[250px] overflow-x-auto m-0"></pre>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const csvInputArea = document.getElementById("csvInput");
        const formatSelect = document.getElementById("formatSelect");
        const outputDisplay = document.getElementById("output");
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const fileNameDisplay = document.getElementById("fileNameDisplay");
        const fileNameText = document.getElementById("fileNameText");
        
        // Column Selection Elements
        const columnSelectionContainer = document.getElementById("columnSelectionContainer");
        const checkboxesGrid = document.getElementById("checkboxesGrid");

        // Global State
        let parsedFileData = []; 
        let currentHeaders = [];

        // --- Robust CSV Parsing Logic ---
        
        // Character-by-character parser to handle escaped quotes and commas inside strings
        function splitCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                
                // Handle escaped double quotes ("") inside quotes
                if (char === '"' && text[i+1] === '"' && inQuotes) {
                    current += '"';
                    i++; // skip the next quote
                } 
                // Toggle quote state
                else if (char === '"') {
                    inQuotes = !inQuotes;
                } 
                // Split by comma if we are not inside quotes
                else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } 
                // Append standard character
                else {
                    current += char;
                }
            }
            result.push(current); // push the last value
            
            // Trim whitespace from resulting strings
            return result.map(s => s.trim());
        }

        // Parse multiline raw CSV text into array of objects
        function parseRawCSV(csvText) {
            const lines = csvText.trim().split(/\r?\n/);
            
            if (lines.length < 1 || !lines[0]) {
                parsedFileData = [];
                return [];
            }

            // Extract headers and strip surrounding quotes safely
            const headers = splitCSVLine(lines[0]);
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                if(!lines[i].trim()) continue; // Skip empty lines
                
                const values = splitCSVLine(lines[i]);
                const obj = {};

                headers.forEach((header, index) => {
                    let val = values[index] || "";
                    obj[header] = val;
                });
                result.push(obj);
            }

            parsedFileData = result;
            return result;
        }

        // --- STREAMING_CHUNK:Implementing header extraction and checkbox generation... ---
        function extractHeaders() {
            const manualText = csvInputArea.value.trim();
            let newHeaders = [];
            
            if (manualText) {
                const firstLine = manualText.split(/\r?\n/)[0];
                if (firstLine) {
                    newHeaders = splitCSVLine(firstLine).filter(h => h);
                }
            } else if (parsedFileData && parsedFileData.length > 0) {
                newHeaders = Object.keys(parsedFileData[0]);
            }

            // Only update checkboxes if the headers have changed
            if (JSON.stringify(newHeaders) !== JSON.stringify(currentHeaders)) {
                currentHeaders = newHeaders;
                renderCheckboxes();
            }
        }

        function renderCheckboxes() {
            checkboxesGrid.innerHTML = '';
            
            if (currentHeaders.length === 0) {
                columnSelectionContainer.classList.add('hidden');
                return;
            }

            columnSelectionContainer.classList.remove('hidden');

            currentHeaders.forEach(header => {
                const id = 'chk_' + header.replace(/\W/g, '_');
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 bg-white border border-slate-200 px-3 py-1.5 rounded-md cursor-pointer hover:bg-slate-50 transition-colors shadow-sm';
                
                label.innerHTML = `
                    <input type="checkbox" checked value="${header}" class="header-checkbox w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" onchange="convertData()">
                    <span class="text-sm font-medium text-slate-700 truncate max-w-[150px]" title="${header}">${header}</span>
                `;
                checkboxesGrid.appendChild(label);
            });
        }

        function selectAllColumns(select) {
            const checkboxes = document.querySelectorAll('.header-checkbox');
            checkboxes.forEach(cb => cb.checked = select);
            convertData();
        }

        // --- STREAMING_CHUNK:Handling drag and drop and file processing (SheetJS)... ---
        function handleFiles(file) {
            if (!file) return;

            fileNameText.textContent = file.name;
            fileNameDisplay.classList.remove('hidden');
            csvInputArea.value = ''; // Clear text area to prioritize file

            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    if (extension === 'csv') {
                        // Parse raw CSV
                        parseRawCSV(e.target.result);
                    } else if (extension === 'xlsx' || extension === 'xls') {
                        // Parse Excel using SheetJS
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // Convert sheet directly to JSON array of objects
                        parsedFileData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    } else {
                        throw new Error("Unsupported file type.");
                    }
                    
                    showToast("File loaded successfully!");
                    extractHeaders();
                    convertData();

                } catch (err) {
                    outputDisplay.textContent = "Error processing file: " + err.message;
                }
            };

            if (extension === 'csv') {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
        }

        // Drag and Drop Listeners
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
            dropZone.classList.remove('border-slate-300');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
            dropZone.classList.add('border-slate-300');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
            dropZone.classList.add('border-slate-300');
            
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFiles(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files[0]);
            }
        });

        // Text Area Listeners (for auto-extracting headers and auto-converting)
        csvInputArea.addEventListener('input', () => {
            if(csvInputArea.value.trim() !== "") {
                // If user types, clear file data so text takes precedence
                parsedFileData = [];
                fileNameDisplay.classList.add('hidden');
                fileInput.value = "";
            }
            extractHeaders();
            convertData();
        });


        // --- STREAMING_CHUNK:Data formatting, output generation, and utilities... ---
        function pythonRepr(obj, indent = 4) {
            return JSON.stringify(obj, null, indent)
                .replace(/true/g, "True")
                .replace(/false/g, "False")
                .replace(/null/g, "None")
                .replace(/"/g, "'"); // Convert double quotes to single for python dictionaries
        }

        function getSelectedHeaders() {
            const checkboxes = document.querySelectorAll('.header-checkbox');
            const selected = [];
            checkboxes.forEach(cb => {
                if (cb.checked) selected.push(cb.value);
            });
            return selected;
        }

        function convertData() {
            const format = formatSelect.value;
            let finalData = [];

            try {
                // Determine data source
                if (csvInputArea.value.trim() !== "") {
                    // Re-parse raw text if it exists
                    parseRawCSV(csvInputArea.value);
                }
                
                // Apply Field Filtering
                const selectedHeaders = getSelectedHeaders();
                
                if (parsedFileData.length > 0 && selectedHeaders.length > 0) {
                    finalData = parsedFileData.map(row => {
                        let filteredRow = {};
                        selectedHeaders.forEach(header => {
                            // Ensure key exists, fallback to empty string
                            filteredRow[header] = row[header] !== undefined ? row[header] : "";
                        });
                        return filteredRow;
                    });
                } else if (parsedFileData.length > 0 && selectedHeaders.length === 0) {
                     // Empty result if everything is deselected
                    finalData = [];
                }

                // Format Output
                if (finalData.length === 0 && currentHeaders.length === 0) {
                    outputDisplay.textContent = "";
                    return;
                }

                if (format === "json") {
                    outputDisplay.textContent = JSON.stringify(finalData, null, 4);
                } else {
                    outputDisplay.textContent = pythonRepr(finalData);
                }
            } catch (error) {
                outputDisplay.textContent = "Error parsing data: " + error.message;
            }
        }

        function clearInputs() {
            csvInputArea.value = '';
            fileInput.value = '';
            parsedFileData = [];
            currentHeaders = [];
            fileNameDisplay.classList.add('hidden');
            columnSelectionContainer.classList.add('hidden');
            outputDisplay.textContent = '';
            extractHeaders();
        }

        // Utility: Custom Toast Notification
        function showToast(message) {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            toastMsg.textContent = message;
            toast.classList.remove("opacity-0");
            setTimeout(() => {
                toast.classList.add("opacity-0");
            }, 2000);
        }

        // Utility: Copy to Clipboard fallback loop
        function copyOutput() {
            const outputText = outputDisplay.textContent;
            if (!outputText) return;

            // Use legacy execCommand for iFrame compatibility
            const textArea = document.createElement("textarea");
            textArea.value = outputText;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Copied to clipboard!");
            } catch (err) {
                alert("Failed to copy. Please select and copy manually.");
            }
            document.body.removeChild(textArea);
        }

        function downloadOutput() {
            const outputText = outputDisplay.textContent;
            if (!outputText) return;
            
            const format = formatSelect.value;
            const blob = new Blob([outputText], { type: "text/plain" });
            const a = document.createElement("a");
            
            a.href = URL.createObjectURL(blob);
            a.download = format === "json" ? "output.json" : "output.py";
            a.click();
            URL.revokeObjectURL(a.href);
        }
        
        // Initial setup run
        extractHeaders();
    </script>
</body>
</html>
